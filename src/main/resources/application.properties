# ===========================
# Application
# ===========================
spring.application.name=RouteAssign
server.port=8080

# ===========================
# Database
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/routeassign_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=springstudent
spring.datasource.password=springstudent
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


management.endpoints.web.exposure.include=health,info,metrics

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===========================
# JWT
# ===========================
app.jwt.secret=tuRW9snSpCLitOcdzdpSnaZW9snSpCLOcdzdpSnaZW9SpCLitOcdzdpSnaZW9snSpCLOcd
app.jwt.expiration-ms=86400000

# ===========================
# Business Rules
# ===========================
# Business rules are now stored in the assignment_rules table in MySQL.
# Use the admin API to update them at runtime:
#   GET  /api/v1/assignment-rules
#   GET  /api/v1/assignment-rules/{key}
#   PUT  /api/v1/assignment-rules/{key}
# Initial values are seeded by DataInitializer on first startup.

# ===========================
# Redis
# ===========================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# TTL for cached assignment rules and scoring configs (seconds).
# Even if cache invalidation runs on every DB write, this TTL is a
# safety mechanism that ensures stale values never persist indefinitely.
routeassign.cache.rule-ttl-seconds=300
routeassign.cache.scoring-ttl-seconds=300
