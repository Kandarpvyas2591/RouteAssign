# ===========================
# Application
# ===========================
spring.application.name=RouteAssign
server.port=8080

# ===========================
# Database
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/routeassign_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=springstudent
spring.datasource.password=springstudent
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


management.endpoints.web.exposure.include=health,info,metrics

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===========================
# JWT
# ===========================
app.jwt.secret=tuRW9snSpCLitOcdzdpSnaZW9snSpCLOcdzdpSnaZW9SpCLitOcdzdpSnaZW9snSpCLOcd
app.jwt.expiration-ms=86400000

# ===========================
# Business Rules
# ===========================
# Maximum additional delivery distance (km) for same-vendor partner reuse
app.business.max-additional-delivery-distance=10.0

# Distance threshold (km) for after-5PM rule
app.business.after-5pm-max-distance-km=30.0

# Working hours
app.business.working-hour-start=10
app.business.working-hour-end=20

# Cut-off hour for same-day delivery start
app.business.cutoff-hour=17

# ── Busy-partner (cross-vendor) reuse ──────────────────────────────────────
# Enable reuse of partners who are currently busy on a different vendor's order
app.business.enable-busy-partner-reuse=true

# Minutes a partner rests at home before starting the next delivery
app.business.partner-rest-duration-minutes=30
